[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-outreach-engine"
version = "1.0.0"
description = "Autonomous Multi-Agent Outreach, Audit, Enrichment, and Bounded Negotiation Engine using LangGraph"
authors = [{ name = "AI Engineering Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "langchain-anthropic>=0.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "playwright>=1.44.0",
    "beautifulsoup4>=4.12.0",
    "dnspython>=2.6.0",
    "email-validator>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "python-telegram-bot>=21.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "mypy",
    "pytest"
]

[project.scripts]
outreach = "main:app"

[tool.pytest.ini_options]
cache_dir = "/tmp/.pytest_cache"
asyncio_mode = "auto"

